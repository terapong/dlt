<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: page_head}"></head>
<body>

	<nav th:replace="~{layout :: page_navbar}"></nav>

	<!-- Start body -->

	<div class="container pb-5">
		<div class="row justify-content-center">
			<div class="col-lg-9 col-md-11">

				<div class="card shadow-sm border-0 mb-4"
					style="border-radius: 15px; background-color: rgba(255, 255, 255, 0.9);">
					<div class="card-body p-2">
						<ul class="nav nav-pills nav-fill m-0" id="searchTabs"
							role="tablist">
							<li class="nav-item" role="presentation"><a
								class="nav-link active py-3 fw-bold" id="tab-vehicle"
								data-bs-toggle="pill" data-bs-target="#vehicle-search"
								style="border-radius: 10px;"> <i class="bi bi-search me-2"></i>
									ค้นหาจากทะเบียนรถ
							</a></li>
							<li class="nav-item" role="presentation"><a
								class="nav-link py-3 fw-bold" id="tab-cert"
								data-bs-toggle="pill" data-bs-target="#cert-search"
								style="border-radius: 10px;"> <i
									class="bi bi-file-earmark-text me-2"></i> ตรวจสอบหนังสือรับรอง
							</a></li>
						</ul>
					</div>
				</div>

				<div class="card shadow-lg border-0" style="border-radius: 15px;">
					<div class="card-body p-4 p-md-5 tab-content">

						<div class="tab-pane fade show active" id="vehicle-search">
							<div class="text-center mb-4">
								<h4 class="text-primary fw-bold">ตรวจสอบข้อมูลคนขับแอปพลิเคชัน</h4>
								<p class="text-muted">กรอกข้อมูลทะเบียนรถสาธารณะ
									(ป้ายเหลือง) เพื่อค้นหาประวัติผู้ขับขี่</p>
							</div>

							<form id="formSearchVehicle"
								class="row justify-content-center align-items-end g-2">
								<div class="col-md-3">
									<label class="form-label fw-bold text-secondary">หมวดอักษร</label>
									<input type="text" name="plate_category"
										class="form-control text-center border-primary"
										placeholder="เช่น 1กข" required>
								</div>
								<div class="col-md-3">
									<label class="form-label fw-bold text-secondary">เลขทะเบียน</label>
									<input type="text" name="plate_number"
										class="form-control text-center border-primary"
										placeholder="เช่น 1234" required maxlength="4">
								</div>
								<div class="col-md-3">
									<label class="form-label fw-bold text-secondary">จังหวัด</label>
									<select name="province" class="form-select border-primary">
										<option value="กรุงเทพมหานคร">กรุงเทพมหานคร</option>
										<option value="กระบี่">กระบี่</option>
										<option value="กาญจนบุรี">กาญจนบุรี</option>
										<option value="กาฬสินธุ์">กาฬสินธุ์</option>
										<option value="กำแพงเพชร">กำแพงเพชร</option>
										<option value="ขอนแก่น">ขอนแก่น</option>
										<option value="จันทบุรี" selected>จันทบุรี</option>
										<option value="ฉะเชิงเทรา">ฉะเชิงเทรา</option>
										<option value="ชลบุรี">ชลบุรี</option>
										<option value="ชัยนาท">ชัยนาท</option>
										<option value="ชัยภูมิ">ชัยภูมิ</option>
										<option value="ชุมพร">ชุมพร</option>
										<option value="เชียงราย">เชียงราย</option>
										<option value="เชียงใหม่">เชียงใหม่</option>
										<option value="ตรัง">ตรัง</option>
										<option value="ตราด">ตราด</option>
										<option value="ตาก">ตาก</option>
										<option value="นครนายก">นครนายก</option>
										<option value="นครปฐม">นครปฐม</option>
										<option value="นครพนม">นครพนม</option>
										<option value="นครราชสีมา">นครราชสีมา</option>
										<option value="นครศรีธรรมราช">นครศรีธรรมราช</option>
										<option value="นครสวรรค์">นครสวรรค์</option>
										<option value="นนทบุรี">นนทบุรี</option>
										<option value="นราธิวาส">นราธิวาส</option>
										<option value="น่าน">น่าน</option>
										<option value="บึงกาฬ">บึงกาฬ</option>
										<option value="บุรีรัมย์">บุรีรัมย์</option>
										<option value="ปทุมธานี">ปทุมธานี</option>
										<option value="ประจวบคีรีขันธ์">ประจวบคีรีขันธ์</option>
										<option value="ปราจีนบุรี">ปราจีนบุรี</option>
										<option value="ปัตตานี">ปัตตานี</option>
										<option value="พระนครศรีอยุธยา">พระนครศรีอยุธยา</option>
										<option value="พะเยา">พะเยา</option>
										<option value="พังงา">พังงา</option>
										<option value="พัทลุง">พัทลุง</option>
										<option value="พิจิตร">พิจิตร</option>
										<option value="พิษณุโลก">พิษณุโลก</option>
										<option value="เพชรบุรี">เพชรบุรี</option>
										<option value="เพชรบูรณ์">เพชรบูรณ์</option>
										<option value="แพร่">แพร่</option>
										<option value="ภูเก็ต">ภูเก็ต</option>
										<option value="มหาสารคาม">มหาสารคาม</option>
										<option value="มุกดาหาร">มุกดาหาร</option>
										<option value="แม่ฮ่องสอน">แม่ฮ่องสอน</option>
										<option value="ยโสธร">ยโสธร</option>
										<option value="ยะลา">ยะลา</option>
										<option value="ร้อยเอ็ด">ร้อยเอ็ด</option>
										<option value="ระนอง">ระนอง</option>
										<option value="ระยอง">ระยอง</option>
										<option value="ราชบุรี">ราชบุรี</option>
										<option value="ลพบุรี">ลพบุรี</option>
										<option value="ลำปาง">ลำปาง</option>
										<option value="ลำพูน">ลำพูน</option>
										<option value="เลย">เลย</option>
										<option value="ศรีสะเกษ">ศรีสะเกษ</option>
										<option value="สกลนคร">สกลนคร</option>
										<option value="สงขลา">สงขลา</option>
										<option value="สตูล">สตูล</option>
										<option value="สมุทรปราการ">สมุทรปราการ</option>
										<option value="สมุทรสงคราม">สมุทรสงคราม</option>
										<option value="สมุทรสาคร">สมุทรสาคร</option>
										<option value="สระแก้ว">สระแก้ว</option>
										<option value="สระบุรี">สระบุรี</option>
										<option value="สิงห์บุรี">สิงห์บุรี</option>
										<option value="สุโขทัย">สุโขทัย</option>
										<option value="สุพรรณบุรี">สุพรรณบุรี</option>
										<option value="สุราษฎร์ธานี">สุราษฎร์ธานี</option>
										<option value="สุรินทร์">สุรินทร์</option>
										<option value="หนองคาย">หนองคาย</option>
										<option value="หนองบัวลำภู">หนองบัวลำภู</option>
										<option value="อ่างทอง">อ่างทอง</option>
										<option value="อำนาจเจริญ">อำนาจเจริญ</option>
										<option value="อุดรธานี">อุดรธานี</option>
										<option value="อุตรดิตถ์">อุตรดิตถ์</option>
										<option value="อุทัยธานี">อุทัยธานี</option>
										<option value="อุบลราชธานี">อุบลราชธานี</option>
									</select>
								</div>
								<div class="col-md-3">
									<button type="submit"
										class="btn btn-primary w-100 fw-bold py-2 shadow-sm">ค้นหาข้อมูล</button>
								</div>
							</form>

							<div id="vehicleResult" class="result-box mt-5"></div>
						</div>

						<div class="tab-pane fade" id="cert-search">
							<div class="text-center mb-4">
								<h4 class="text-success fw-bold">ตรวจสอบสถานะหนังสือรับรอง</h4>
								<p class="text-muted">สำหรับผู้ที่ยื่นขอหนังสือรับรองเพื่อไปจดทะเบียนรถป้ายเหลือง</p>
							</div>

							<form id="formCheckCert"
								class="row justify-content-center align-items-end g-2">
								<div class="col-md-8">
									<label class="form-label fw-bold text-secondary">เลขบัตรประจำตัวประชาชน
										(13 หลัก)</label> <input type="text" name="id_card"
										class="form-control text-center border-success py-2"
										placeholder="กรอกเลขบัตรประชาชน 13 หลัก" required
										maxlength="13" style="letter-spacing: 2px; font-size: 1.1rem;">
								</div>
								<div class="col-md-3">
									<button type="submit"
										class="btn btn-success w-100 fw-bold py-2 shadow-sm">ตรวจสอบสถานะ</button>
								</div>
							</form>

							<div id="certResult" class="result-box mt-5"></div>
						</div>

					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- End body -->

	<footer th:replace="~{layout :: page_footer}"></footer>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>
</html>
