<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: page_head}"></head>
<body>

	<nav th:replace="~{layout :: page_navbar}"></nav>

	<!-- Start body -->
	<div class="container p-5">
	
		<div class="row">
			<!-- <div class="col-md-8 offset-md-2"> -->
			<div>
				<div class="card">

					<div th:if="${session.msg}">
						<h5 class="text-center text-success" th:text="${session.msg}"></h5>
						<!-- นี่คือคอมเมนต์แบบบรรทัดเดียว -->
						<!-- <th:block th:text="${#session.removeAttribute('msg')}"></th:block> -->
					</div>

					<div class="card-header">
						<a th:href="@{/register}" href="load_form" class="btn btn-primary">เพิ่ม เจ้าหน้าที่</a>
					</div>

					<div class="card-body">

						<table class="table">
							<thead>
								<tr>
									<th scope="col">Id</th>
									<th scope="col">Email</th>
									<th scope="col">First Name</th>
									<th scope="col">Last Name</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="p : ${all_users}">
									<th scope="row">[[${p.id}]]</th>
									<td>[[${p.email}]]</td>
									<td>[[${p.firstName}]]</td>
									<td>[[${p.lastName}]]</td>
									<td><a th:href="@{'/edit_form/'+${p.id}}"
										class="btn btn-sm btn-primary">Edit</a> <a
										th:href="@{'/delete/'+${p.id}}" class="btn btn-sm btn-danger">Delete</a></td>
								</tr>

							</tbody>
						</table>

					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- End body -->
	
	<footer th:replace="~{layout :: page_footer}"></footer>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>
</html>
