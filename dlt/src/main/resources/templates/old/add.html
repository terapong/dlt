<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: page_head}"></head>
<body style="background-color: #f0f1f2;">

	<nav th:replace="~{layout :: page_navbar}"></nav>
	
	<!-- Start body -->
	<div class="container p-4">
		<div class="row">
			<div class="col-md-6 offset-md-3">
				<div class="card">
					<div class="card-body">

						<h4 class="text-center text-primary">Add Products Form</h4>

						<div th:if="${session.msg}">
							<h5 class="text-center text-success" th:text="${session.msg}"></h5>
							<!-- นี่คือคอมเมนต์แบบบรรทัดเดียว -->
							<!-- <th:block th:text="${#session.removeAttribute('msg')}"></th:block> -->
						</div>
						<form th:action="@{/save_products}" method="post">
							<div class="mb-3">
								<label for="exampleInputEmail1" class="form-label">Enter
									Products Name </label> <input type="text" class="form-control"
									id="exampleInputEmail1" aria-describedby="emailHelp"
									name="productName">
							</div>

							<div class="mb-3">
								<label for="exampleInputEmail1" class="form-label">Enter
									Description </label> <input type="text" class="form-control"
									id="exampleInputEmail1" aria-describedby="emailHelp"
									name="description">
							</div>

							<div class="mb-3">
								<label for="exampleInputEmail1" class="form-label">Price
								</label> <input type="number" class="form-control"
									id="exampleInputEmail1" aria-describedby="emailHelp"
									name="price">
							</div>

							<div class="mb-3">
								<label for="exampleInputEmail1" class="form-label">Quantity
								</label> <input type="number" class="form-control"
									id="exampleInputEmail1" aria-describedby="emailHelp"
									name="quantity">
							</div>

							<button type="submit" class="btn btn-primary">Add Products</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- End body -->
	
	<footer th:replace="~{layout :: page_footer}"></footer>
	
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>
</html>
