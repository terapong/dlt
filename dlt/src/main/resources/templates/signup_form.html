<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: page_head}"></head>
<body style="background-color: #f0f1f2;">

	<nav th:replace="~{layout :: page_navbar}"></nav>

	<!-- Start body -->
	<div class="container p-4">
		<div class="row">
			<div class="col-md-6 offset-md-3">
				<div class="card">
					<div class="card-body">

						<h4 class="text-center text-primary">User Registration - Sign Up</h4>
						<form th:action="@{/process_register}" method="post"
							style="max-width: 600px; margin: 0 auto;" th:object="${user}">
							
							<div class="m-3">						
								<div class="from-group row">
									<label class="col-form-label col-4">Email</label>
									<div class="col-8">
										<input type="email" class="form-control" th:field="*{email}" required />
									</div>
								</div>
							</div>	
							
							<div class="m-3">
								<div class="from-group row">
									<label class="col-form-label col-4">Password</label>
									<div class="col-8">
										<input type="password" class="form-control" th:field="*{password}" required minlength="6" maxlength="10" />
									</div>
								</div>
							</div>
							
							<div class="m-3">
								<div class="from-group row">
									<label class="col-form-label col-4">First Name</label>
									<div class="col-8">
										<input type="text" class="form-control" th:field="*{firstName}" required minlength="2" maxlength="20" />
									</div>
								</div>
							</div>
							
							<div class="m-3">
								<div class="from-group row">
									<label class="col-form-label col-4">Last Name</label>
									<div class="col-8">
										<input type="text" class="form-control" th:field="*{lastName}" required minlength="2" maxlength="20" />
									</div>
								</div>
							</div>
							
							<button type="submit" class="btn btn-primary">Sign Up</button>
							
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- End body -->

	<footer th:replace="~{layout :: page_footer}"></footer>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>
</html>
